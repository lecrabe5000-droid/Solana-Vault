name: verify-sepolia

# Run by hand: Actions → verify-sepolia → Run workflow.
# Publishes the source of the contract in app/config-evm.js on Sepolia Etherscan (and Sourcify), so anyone,
# wallet scanners included, can read exactly what it does. Needs the ETHERSCAN_API_KEY secret.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: evm/package-lock.json
      - run: npm ci
      - name: Verify
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          if [ -z "$ETHERSCAN_API_KEY" ]; then echo "::error::Add the ETHERSCAN_API_KEY secret first."; exit 1; fi
          ADDR=$(grep -o '0x[0-9a-fA-F]\{40\}' ../app/config-evm.js | head -1)
          if [ -z "$ADDR" ]; then echo "::error::No contract address in app/config-evm.js. Deploy first."; exit 1; fi
          echo "Verifying $ADDR"
          npx hardhat verify --network sepolia "$ADDR" 2>&1 | tee /tmp/verify.log
          grep -Eiq "successfully verified|already verified" /tmp/verify.log
          echo "### Source published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[\`$ADDR\` on Sepolia Etherscan](https://sepolia.etherscan.io/address/$ADDR#code)" >> "$GITHUB_STEP_SUMMARY"
