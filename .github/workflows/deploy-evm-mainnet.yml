name: deploy-evm-mainnet
# Run by hand: Actions → deploy-evm-mainnet → Run workflow, type BASE to confirm.
# Puts the Ecrin Safe contract on Base mainnet for early access (not audited yet; the wallet hides it unless turned on
# in Settings). Needs the repository secret MAINNET_DEPLOYER_KEY: a key used only for this, holding about $1 of ETH on
# Base. Never the testnet deployer key. Optional: ETHERSCAN_API_KEY publishes the source on Basescan.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type BASE to deploy to Base mainnet
        required: true

permissions:
  contents: write

concurrency: deploy-evm-mainnet

jobs:
  deploy:
    if: inputs.confirm == 'BASE'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: evm/package-lock.json
      - run: npm ci
      - run: npx hardhat test
      - name: Deploy to Base mainnet
        env:
          MAINNET_DEPLOYER_KEY: ${{ secrets.MAINNET_DEPLOYER_KEY }}
          CONFIRM_MAINNET: BASE
        run: |
          [ -n "$MAINNET_DEPLOYER_KEY" ] || { echo "::error::Add the MAINNET_DEPLOYER_KEY secret first (Settings → Secrets and variables → Actions)."; exit 1; }
          npx hardhat run scripts/deploy.js --network base
      - name: Publish the source on Basescan
        if: env.ETHERSCAN_API_KEY != ''
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          addr=$(node -e 'const t=require("fs").readFileSync("../app/deployments-evm.js","utf8");const d=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));console.log(d.base.address)')
          npx hardhat verify --network base "$addr" 0x0000000000000000000000000000000000000000 0x0000000000000000000000000000000000000000 0x0000000000000000000000000000000000000000
      - name: Point the wallet at it
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/deployments-evm.js
          git diff --cached --quiet || { git commit -m "EVM contract: Base mainnet (early access)"; git pull --rebase origin main && git push; }
