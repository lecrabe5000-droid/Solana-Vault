name: deploy-evm-mainnet
# Run by hand: Actions → deploy-evm-mainnet → Run workflow → pick the network, and type its name in capitals to confirm
# (ETHEREUM, ARBITRUM, OPTIMISM, POLYGON, BSC, AVALANCHE, HYPEREVM or BASE). One network per run, on purpose.
# Puts the Ecrin Safe contract on that mainnet for early access (not audited yet; the wallet hides it unless turned on
# in Settings; staking stays off on every mainnet). Needs the repository secret MAINNET_DEPLOYER_KEY: a key used only for
# this, holding a little of that network's own coin. Never the testnet deployer key. A network that already has the
# contract is left alone. Optional: ETHERSCAN_API_KEY publishes the source on the network's explorer.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Which mainnet
        required: true
        type: choice
        options: [ethereum, arbitrum, optimism, polygon, bsc, avalanche, hyperevm, base]
      confirm:
        description: Type the network's name in capitals to confirm (e.g. ARBITRUM)
        required: true

permissions:
  contents: write

concurrency: deploy-evm-mainnet

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    env:
      NET: ${{ inputs.network }}
    steps:
      - name: Check the confirmation
        working-directory: .
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          want=$(echo "$NET" | tr '[:lower:]' '[:upper:]')
          [ "$CONFIRM" = "$want" ] || { echo "::error::To deploy on $NET, type $want in the confirm box. Nothing was deployed."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: evm/package-lock.json
      - run: npm ci
      - run: npx hardhat test
      - name: Check the deployer key
        env:
          MAINNET_DEPLOYER_KEY: ${{ secrets.MAINNET_DEPLOYER_KEY }}
        run: '[ -n "$MAINNET_DEPLOYER_KEY" ] || { echo "::error::Add the MAINNET_DEPLOYER_KEY secret first (Settings → Secrets and variables → Actions)."; exit 1; }'
      # Hyperliquid only lets an address that exists on HyperCore switch to big blocks: open it from the deployer's own HYPE.
      - name: HyperCore account for the deployer
        if: inputs.network == 'hyperevm'
        env:
          DEPLOYER_KEY: ${{ secrets.MAINNET_DEPLOYER_KEY }}
        run: node scripts/hyper-core-activate.js
      # HyperEVM's normal blocks are too small for this contract: switch the deployer to big blocks first.
      - name: HyperEVM big blocks on
        if: inputs.network == 'hyperevm'
        env:
          DEPLOYER_KEY: ${{ secrets.MAINNET_DEPLOYER_KEY }}
          HL_MAINNET: "1"
        run: node scripts/hyper-big-blocks.js on
      - name: Deploy
        env:
          MAINNET_DEPLOYER_KEY: ${{ secrets.MAINNET_DEPLOYER_KEY }}
          CONFIRM_MAINNET: ${{ inputs.confirm }}
        run: npx hardhat run scripts/deploy.js --network "$NET"
      - name: HyperEVM big blocks off
        if: always() && inputs.network == 'hyperevm'
        continue-on-error: true
        env:
          DEPLOYER_KEY: ${{ secrets.MAINNET_DEPLOYER_KEY }}
          HL_MAINNET: "1"
        run: node scripts/hyper-big-blocks.js off
      - name: Publish the source on the explorer
        if: env.ETHERSCAN_API_KEY != ''
        continue-on-error: true
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          addr=$(node -e 'const t=require("fs").readFileSync("../app/deployments-evm.js","utf8");const d=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));console.log(d[process.env.NET].address)')
          npx hardhat verify --network "$NET" "$addr" 0x0000000000000000000000000000000000000000 0x0000000000000000000000000000000000000000 0x0000000000000000000000000000000000000000
      - name: Point the wallet at it
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/deployments-evm.js
          git diff --cached --quiet || { git commit -m "EVM contract: $NET mainnet (early access)"; git pull --rebase origin main && git push; }
