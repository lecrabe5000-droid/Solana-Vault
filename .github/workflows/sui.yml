name: sui-safe
# Builds and tests the Sui Safe (sui/), and on request publishes it to Sui Testnet or Sui mainnet.
# Testnet publishing uses the SUI_DEPLOYER_KEY secret (a TESTNET-ONLY key). Mainnet publishing uses its own secret,
# SUI_MAINNET_DEPLOYER_KEY (suiprivkey..., the "Sui" line of Ecrin's Export private key), holding about 0.3 SUI or more.
on:
  push:
    paths: ["sui/**", ".github/workflows/sui.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the Safe"
        type: boolean
        default: false
      network:
        description: "Where to publish"
        type: choice
        options: [testnet, mainnet]
        default: testnet
      live:
        description: "Run the wallet's Safe flow for real on Sui Testnet (uses the deployer's test SUI)"
        type: boolean
        default: false

jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install the Sui CLI (Mysten Labs' latest release for the network)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="${{ inputs.network == 'mainnet' && 'mainnet' || 'testnet' }}"
          tag=$(gh release list -R MystenLabs/sui --limit 40 --json tagName -q '.[].tagName' | grep -m1 "^$want-v")
          echo "Sui CLI $tag"
          gh release download "$tag" -R MystenLabs/sui -p "sui-$tag-ubuntu-x86_64.tgz" -D /tmp/sui
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/sui/*.tgz -C /tmp/sui
          find /tmp/sui -type f -name sui -perm -u+x -exec cp {} "$HOME/.local/bin/sui" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/sui" --version
      - name: Build
        working-directory: sui
        run: sui move build
      - name: Test
        working-directory: sui
        run: sui move test

      - uses: actions/setup-node@v4
        if: ${{ inputs.publish || inputs.live }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Wallet code (pays the publish gas from a coin, and runs the live test)
        if: ${{ inputs.publish || inputs.live }}
        working-directory: extension
        run: npm ci --no-audit --no-fund
      - name: Publish to Sui ${{ inputs.network }}
        if: ${{ inputs.publish }}
        working-directory: sui
        env:
          NET: ${{ inputs.network }}
          KEY: ${{ inputs.network == 'mainnet' && secrets.SUI_MAINNET_DEPLOYER_KEY || secrets.SUI_DEPLOYER_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            if [ "$NET" = mainnet ]; then echo "::error::Add the SUI_MAINNET_DEPLOYER_KEY secret first (the Sui key of the account you funded)."; else echo "::error::Add the SUI_DEPLOYER_KEY secret first (a testnet-only key)."; fi
            exit 1
          fi
          mkdir -p ~/.sui/sui_config
          echo '[]' > ~/.sui/sui_config/sui.keystore
          cat > ~/.sui/sui_config/client.yaml <<EOF
          keystore:
            File: $HOME/.sui/sui_config/sui.keystore
          envs:
            - alias: $NET
              rpc: "https://fullnode.$NET.sui.io:443"
              ws: ~
          active_env: $NET
          active_address: ~
          EOF
          sui keytool import "$KEY" ed25519 > /dev/null
          addr=$(sui keytool list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].suiAddress))')
          sui client switch --address "$addr"
          echo "Deployer $addr"
          echo "Publishing from \`$addr\` on Sui $NET" >> "$GITHUB_STEP_SUMMARY"
          # Balance from Sui's own GraphQL service (coins and the address balance both count).
          bal=$(curl -sS https://graphql.$NET.sui.io/graphql -H 'content-type: application/json' --data "{\"query\":\"{address(address:\\\"$addr\\\"){balance(coinType:\\\"0x2::sui::SUI\\\"){totalBalance coinBalance}}}\"}")
          echo "Balance: $bal"
          total=$(echo "$bal" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).data?.address?.balance?.totalBalance||0))')
          if [ "$total" -lt 650000000 ]; then echo "::error::The deployer $addr holds $total MIST; it needs about 0.65 SUI on $NET."; exit 1; fi
          # The CLI pays gas with coin objects. When the SUI sits in the address balance, the wallet's own code sends
          # 0.6 SUI from it to this same address, which arrives as a coin.
          coins=$(echo "$bal" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).data?.address?.balance?.coinBalance||0))')
          if [ "$coins" -lt 550000000 ]; then
            (cd ../extension && node --input-type=module -e '
              import { bech32 } from "@scure/base"; import { suiEngine, SUI, SUI_MAIN } from "./src/sui.js";
              const { bytes } = bech32.decodeToBytes(process.env.KEY.trim()), net = process.env.NET;
              const N = net === "mainnet" ? SUI_MAIN : SUI, api = `https://graphql.${net}.sui.io/graphql`;
              const e = suiEngine({ acct: { sui: bytes.slice(1, 33) }, dev: { suiApi: api }, N });
              console.log("Gas coin:", await e.send("native", e.address, 600_000_000));')
          fi
          # Pay with the largest coin, named explicitly: left to choose, the CLI can pick a small leftover coin and
          # run out of gas. Wait until the new coin is visible to it (up to a minute).
          gas=""
          for i in $(seq 1 20); do
            gas=$(curl -sS https://graphql.$NET.sui.io/graphql -H 'content-type: application/json' --data "{\"query\":\"{address(address:\\\"$addr\\\"){objects(filter:{type:\\\"0x2::coin::Coin<0x2::sui::SUI>\\\"}){nodes{address contents{json}}}}}\"}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let c=null;try{c=(JSON.parse(s).data?.address?.objects?.nodes||[]).map((x)=>({id:x.address,v:BigInt(x.contents?.json?.balance||0)})).sort((a,b)=>(b.v>a.v?1:-1))[0]}catch(e){}console.log(c&&c.v>=550000000n?c.id:"")})')
            [ -n "$gas" ] && break; sleep 3
          done
          if [ -z "$gas" ]; then echo "::error::No coin of 0.55 SUI or more appeared to pay the publish."; sui client gas; exit 1; fi
          echo "Paying with $gas"
          if ! sui client publish --gas "$gas" --gas-budget 500000000 --json > /tmp/pub.json; then cat /tmp/pub.json; exit 1; fi
          node - <<'JS'
          const fs = require("fs"), r = JSON.parse(fs.readFileSync("/tmp/pub.json", "utf8")), net = process.env.NET;
          if (r.effects?.status?.status !== "success") { console.error(JSON.stringify(r.effects?.status)); process.exit(1); }
          const ch = r.objectChanges || [];
          const pkg = ch.find((c) => c.type === "published")?.packageId;
          const registry = ch.find((c) => c.type === "created" && /::safe::Registry$/.test(c.objectType))?.objectId;
          const cap = ch.find((c) => c.type === "created" && /::package::UpgradeCap$/.test(c.objectType))?.objectId;
          if (!pkg || !registry) { console.error("Couldn't find the package or the registry", JSON.stringify(ch)); process.exit(1); }
          // keep the other network's entry: testnet and mainnet live side by side
          const out = "../app/deployments-sui.js", src = fs.readFileSync(out, "utf8");
          const prev = JSON.parse(src.slice(src.indexOf("{"), src.lastIndexOf("}") + 1));
          // The package this replaces keeps its Safes: the wallet still finds and runs them there (Sui keeps every
          // package callable, and each has its own registry). strict: this package has the strict options.
          const old = prev[net] ? [{ ...prev[net], older: undefined }, ...(prev[net].older || [])].filter((x) => x.package && x.package !== pkg).map(({ older, ...x }) => x) : [];
          prev[net] = { package: pkg, registry, digest: r.digest, ...(cap ? { upgradeCap: cap } : {}), strict: true, ...(old.length ? { older: old } : {}) };
          fs.writeFileSync(out, `// Written by the sui-safe workflow after each publish (sui/): Sui Testnet and Sui mainnet.\nexport const SUI_SAFE = ${JSON.stringify(prev, null, 2)};\n`);
          console.log("Published", net, pkg, "registry", registry, "upgrade cap", cap);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Ecrin Safe on Sui ${net}\n\nPackage \`${pkg}\`, registry \`${registry}\`${cap ? `, upgrade cap \`${cap}\` (held by the deployer)` : ""} ([tx](https://suiscan.xyz/${net}/tx/${r.digest}))\n`);
          JS
      - name: Point the wallet at it
        if: ${{ inputs.publish }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/deployments-sui.js
          git diff --cached --quiet || { git commit -m "Sui Safe published on ${{ inputs.network }}"; git pull --rebase origin main && git push; }

      - name: The wallet's Safe flow on Sui Testnet
        if: ${{ inputs.live }}
        working-directory: extension
        env:
          SUI_TEST_KEY: ${{ secrets.SUI_DEPLOYER_KEY }}
        run: |
          git pull -q origin main || true
          node test/sui-safe.live.mjs
