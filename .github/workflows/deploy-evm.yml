name: deploy-evm

# Run by hand: Actions → deploy-evm → Run workflow, then pick a network or "all".
# Deploys the Ecrin contract to Ethereum-style test networks and points the website at it (app/deployments-evm.js).
# Needs one repository secret: EVM_DEPLOYER_KEY (SEPOLIA_DEPLOYER_KEY also works), the private key of a wallet
# used only for testnets, holding a little test coin on each network for gas. The same address works on all of them.
# Optional: ETHERSCAN_API_KEY publishes the source on each network's explorer; RPC_<NETWORK> overrides a public RPC.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Where to deploy
        type: choice
        default: all
        options: [all, sepolia, baseSepolia, arbitrumSepolia, optimismSepolia, polygonAmoy]

permissions:
  contents: write

concurrency: deploy-evm

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    env:
      DEPLOYER_KEY: ${{ secrets.EVM_DEPLOYER_KEY || secrets.SEPOLIA_DEPLOYER_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: evm/package-lock.json
      - run: npm ci
      - name: Test before deploying
        run: npx hardhat test
      - name: Deploy
        run: |
          if [ -z "$DEPLOYER_KEY" ]; then echo "::error::Add the EVM_DEPLOYER_KEY secret first (Settings → Secrets and variables → Actions)."; exit 1; fi
          if [ "${{ inputs.network }}" = all ]; then nets="sepolia baseSepolia arbitrumSepolia optimismSepolia polygonAmoy"; else nets="${{ inputs.network }}"; fi
          failed=""
          for n in $nets; do
            echo "::group::$n"
            if npx hardhat run scripts/deploy.js --network "$n"; then
              echo "$n" >> /tmp/deployed
            else
              echo "::warning::$n was not deployed (see the log above)"; failed="$failed $n"
            fi
            echo "::endgroup::"
          done
          echo "FAILED=$failed" >> "$GITHUB_ENV"
      - name: Publish the source on each explorer
        # Explorers need a moment to index a new contract; a failure here doesn't undo the deploy.
        continue-on-error: true
        run: |
          if [ -z "$ETHERSCAN_API_KEY" ] || [ ! -f /tmp/deployed ]; then echo "Skipping."; exit 0; fi
          sleep 30
          for n in $(cat /tmp/deployed); do
            addr=$(node -e 'const t=require("fs").readFileSync("../app/deployments-evm.js","utf8");console.log(JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))[process.argv[1]].address)' "$n")
            npx hardhat verify --network "$n" "$addr" || echo "::warning::Couldn't verify on $n yet; run verify-evm later."
          done
      - name: Point the website at it
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/deployments-evm.js
          git diff --cached --quiet || { git commit -m "EVM contracts: $(cat /tmp/deployed 2>/dev/null | tr '\n' ' ')"; git push; }
      - name: Report networks that failed
        run: |
          if [ -n "$FAILED" ]; then echo "::error::Not deployed:$FAILED. Usually the deployer needs test coins there; the log says which address to fund."; exit 1; fi
