name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cargo test -p vault-core
      - run: node app/vault.test.mjs

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
          key: anchor-${{ hashFiles('Cargo.lock') }}
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor (release binary, cargo as fallback)
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if curl -fsSL -o "$HOME/.local/bin/anchor" https://github.com/coral-xyz/anchor/releases/download/v0.31.1/anchor-0.31.1-x86_64-unknown-linux-gnu; then
            chmod +x "$HOME/.local/bin/anchor"
          else
            cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked
          fi
      - name: Versions (fail if a tool is missing)
        run: |
          set -euo pipefail
          solana --version
          anchor --version | tee /dev/stderr | grep -q "0.31.1"
          cargo --version
      - name: Local wallet
        run: solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
      - run: npm install
      - name: Build, then match the program id to this build's keypair, then rebuild
        run: |
          anchor build
          anchor keys sync
          anchor build
      - name: Test on a local validator
        run: |
          set -o pipefail
          anchor test --skip-build 2>&1 | tee anchor-test.log
          grep -Eq "[1-9][0-9]* passing" anchor-test.log
          ! grep -Eq "[1-9][0-9]* failing" anchor-test.log
