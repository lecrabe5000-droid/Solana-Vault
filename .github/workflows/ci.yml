name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cargo test -p vault-core
      - run: node app/vault.test.mjs

  evm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: evm/package-lock.json
      - run: npm ci
      - name: Contract tests
        run: |
          npx hardhat test | tee /tmp/evm-test.log
          grep -Eq "^ +[0-9]+ passing" /tmp/evm-test.log
          ! grep -Eq "^ +[0-9]+ failing" /tmp/evm-test.log

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
          key: anchor-${{ hashFiles('Cargo.lock') }}
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor (release binary, cargo as fallback)
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if curl -fsSL -o "$HOME/.local/bin/anchor" https://github.com/coral-xyz/anchor/releases/download/v0.31.1/anchor-0.31.1-x86_64-unknown-linux-gnu; then
            chmod +x "$HOME/.local/bin/anchor"
          else
            cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked
          fi
      - name: Versions (fail if a tool is missing)
        run: |
          set -euo pipefail
          solana --version
          anchor --version | tee /dev/stderr | grep -q "0.31.1"
          cargo --version
      - name: Local wallet
        run: solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json
      - run: npm install
      - name: Use the test-only program keypair, so the address matches declare_id
        run: mkdir -p target/deploy && cp keys/localnet-program-keypair.json target/deploy/cooldown_vault-keypair.json
      - name: Build
        run: anchor build
      - name: Check the program id everywhere agrees
        run: |
          set -euo pipefail
          want=$(solana address -k target/deploy/cooldown_vault-keypair.json)
          echo "program id: $want"
          grep -q "declare_id!(\"$want\")" programs/cooldown-vault/src/lib.rs
          grep -q "cooldown_vault = \"$want\"" Anchor.toml
          grep -q "\"address\": \"$want\"" target/idl/cooldown_vault.json
      - name: Test on a local validator
        run: |
          set -o pipefail
          anchor test --skip-build 2>&1 | tee anchor-test.log
          grep -Eq "[1-9][0-9]* passing" anchor-test.log
          ! grep -Eq "[1-9][0-9]* failing" anchor-test.log
      - name: Browser client (app/chain.js) against a local validator
        run: |
          set -euo pipefail
          id=$(solana address -k target/deploy/cooldown_vault-keypair.json)
          # Own ports and ledger, so a validator left over from anchor test can't collide.
          solana-test-validator --reset --quiet --ledger /tmp/client-ledger --rpc-port 8999 --faucet-port 9999 --bpf-program "$id" target/deploy/cooldown_vault.so &
          for i in $(seq 1 90); do solana cluster-version -u http://127.0.0.1:8999 >/dev/null 2>&1 && break; sleep 1; done
          solana cluster-version -u http://127.0.0.1:8999
          RPC=http://127.0.0.1:8999 node tests/client.test.mjs
