[package]
name = "cooldown-vault"
version = "0.1.0"
edition = "2021"
description = "On-chain Cooldown Vault: holds SOL in a PDA and enforces vault-core's rules."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "cooldown_vault"

[features]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
vault-core = { path = "../../crates/vault-core" }

