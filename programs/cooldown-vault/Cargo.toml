[package]
name = "cooldown-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "On-chain Cooldown Vault: holds SOL in a PDA and SPL tokens (USDC) in token vaults and enforces vault-core's rules."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "cooldown_vault"

[features]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "associated_token"] }
vault-core = { path = "../../crates/vault-core" }

